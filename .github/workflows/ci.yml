# push / pull request のたびに、バックエンドのテストとフロントエンドのビルドを自動で実行する。
name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # KintaiflowApplicationTests は実 DB に接続し、Flyway で空の DB から全マイグレーションを流す。
    # ここで使う DB・パスワード・JWT 鍵は CI 内だけの使い捨ての値（本番・開発の値ではない）。
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kintaiflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kintaiflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SPRING_DATASOURCE_PASSWORD: ci-only-password
      KINTAIFLOW_JWT_SECRET: Y2ktb25seS1qd3Qtc2VjcmV0LWNpLW9ubHktand0LXNlY3JldC0wMTIzNDU2Nzg5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

# push / pull request のたびに、バックエンドのテストとフロントエンドのビルドを自動で実行する。
name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # 結合テストは Testcontainers が使い捨ての PostgreSQL を起動する（GitHub のランナーには Docker が入っている）。
    # CI では Docker が無いとテストを飛ばさず失敗させる（IntegrationTestBase の DockerAvailableCondition）。
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # セキュリティヘッダー
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # API はバックエンドへ中継（同一オリジンになるので CORS 不要）
  location /api/ {
    proxy_pass http://backend:8080;
    # ポート付きの Host（例: localhost:8081）をそのまま渡す。$host はポートを落とすため、ブラウザが付ける
    # Origin（http://localhost:8081）と一致せず、Spring が同一オリジンの POST を「不正な CORS」として 403 にしてしまう。
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 画面は SPA：存在しないパスは index.html に戻す
  location / {
    try_files $uri $uri/ /index.html;
  }
}

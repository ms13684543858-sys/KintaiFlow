spring.application.name=kintaiflow

# --- Database (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/kintaiflow
spring.datasource.username=postgres
# password is defined in application-local.properties (not committed to Git)
spring.config.import=optional:classpath:application-local.properties

# テーブルは Flyway が src/main/resources/db/migration/V*.sql から作成・更新する。JPA は定義との一致を検査するだけ
spring.flyway.enabled=true
# 既に（旧 schema.sql で）作ったテーブルがある開発DBは、V1 適用済みとみなして引き継ぐ
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- JWT ---
kintaiflow.jwt.expiration-hours=2

# DBセッションのタイムゾーンを日本時間に固定（BAT-002の月判定等に影響）
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Tokyo'

# --- バッチ（BAT-001 年休自動付与 / BAT-002 年5日取得義務アラート）。cron・遡り日数などの既定値はコード側 ---
# 2台目以降のインスタンスやテストでは kintaiflow.batch.scheduling-enabled=false にする
spring.task.scheduling.pool.size=3
spring.task.scheduling.thread-name-prefix=kf-batch-
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=60s
# 行ロック（SELECT ... FOR UPDATE）の待ち上限 5 秒。超過した1件は失敗として数え、他の件は続行する
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

# --- 監視（ヘルスチェックのみ公開） ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# --- CORS（開発時のフロント）。本番は Nginx で同一オリジンにするため不要 ---
kintaiflow.cors.allowed-origins=http://localhost:5173

# 勤怠フロー 一式をまとめて起動する（開発・検証・小規模本番の共通構成）。
#   起動:  docker compose up -d --build
#   停止:  docker compose down            （データは volume に残る）
# 秘密情報は .env に書く（.env.example をコピー）。.env は Git に入れない。
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: kintaiflow
      POSTGRES_USER: kintaiflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD を .env に設定してください}
      TZ: Asia/Tokyo
    volumes:
      - dbdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kintaiflow -d kintaiflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/kintaiflow
      SPRING_DATASOURCE_USERNAME: kintaiflow
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      KINTAIFLOW_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET を .env に設定してください}
      # BAT-003 バックアップ（毎日 03:30、7世代）。接続先は上の DB と同じ。出力先は volume（backupdata）の /backup
      DB_HOST: db
      DB_USER: kintaiflow
      DB_PASSWORD: ${DB_PASSWORD}
      KINTAIFLOW_BATCH_BACKUP_DIR: /backup
      # API ドキュメント（Swagger UI）。本番では false のまま。デモでは .env.demo で true にする
      KINTAIFLOW_API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      # 開発用ダミーユーザーを入れたい時だけ設定する。本番では空にする。
      KINTAIFLOW_DEV_SEED_ENABLED: ${DEV_SEED_ENABLED:-false}
      KINTAIFLOW_DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:-}
      # 本番の初回起動：ユーザーが0件のときだけ、この管理者を1名作る（初回ログイン時にパスワード変更を要求）
      KINTAIFLOW_BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      KINTAIFLOW_BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      # バックアップは DB と別の volume に置く（同じ volume だと DB 破損時に両方失う）。オフサイトへのコピーは運用で行う
      - backupdata:/backup
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8081}:80"

volumes:
  dbdata:
  backupdata:
